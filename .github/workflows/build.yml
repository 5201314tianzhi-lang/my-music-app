name: 构建 Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 克隆代码
      uses: actions/checkout@v4
    
    - name: 设置 Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: 缓存 Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: 安装 Android SDK 工具
      run: |
        mkdir -p $ANDROID_HOME/licenses
        echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > $ANDROID_HOME/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_HOME/licenses/android-sdk-license
        sudo apt-get update
        sudo apt-get install -y android-sdk
        # 下载并安装 command-line-tools
        curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
        sudo mkdir -p /usr/local/lib/android-sdk/cmdline-tools
        sudo unzip -q /tmp/cmdline-tools.zip -d /usr/local/lib/android-sdk/cmdline-tools
        sudo mv /usr/local/lib/android-sdk/cmdline-tools/tools /usr/local/lib/android-sdk/cmdline-tools/latest
        export PATH="$PATH:/usr/local/lib/android-sdk/cmdline-tools/latest/bin"
        sdkmanager "platforms;android-33" "build-tools;33.0.2"
    
    - name: 添加执行权限
      run: chmod +x ./gradlew
    
    - name: 构建 Debug APK
      working-directory: ./android
      run: ./gradlew assembleDebug
    
    - name: 上传 APK 文件
      uses: actions/upload-artifact@v4
      with:
        name: MyMusic-App
        path: android/app/build/outputs/apk/debug/*.apk
        retention-days: 30
